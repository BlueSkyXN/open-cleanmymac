name: Acceptance

# 真实环境验收：仅在一次性 macOS runner 上运行，会启动真实 brew 并挂载
# 磁盘镜像。手动触发或每周定时，不进入 PR 检查路径；结论以每次运行日志为准。
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-environment:
    name: ${{ matrix.os }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        suite: [homebrew, volumes, zig, deriveddata, exfat, unicode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run real-environment acceptance (${{ matrix.suite }})
        env:
          OPENCLEAN_REAL_ENV_ACCEPTANCE: "1"
        run: python3 implementation/scripts/acceptance_real_env.py --suite ${{ matrix.suite }}

  # 性能基准只记录趋势（continue-on-error），不做阈值拦截，避免 runner
  # 性能波动制造假警报；结果以 artifact 历史对比为准。
  benchmarks:
    name: ${{ matrix.os }} / benchmarks (record-only)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Run analyze benchmark
        continue-on-error: true
        run: |
          cd implementation
          PYTHONPATH=. python3 scripts/benchmark_analyze.py --entries 10000 --repeat 3 \
            | tee ../analyze-benchmark.json

      - name: Run scan UI benchmark
        continue-on-error: true
        run: |
          cd implementation
          PYTHONPATH=. python3 scripts/benchmark_scan_ui.py --samples 5 \
            --output ../scan-ui-benchmark.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: open-cleanmymac-benchmarks-${{ matrix.os }}
          path: |
            analyze-benchmark.json
            scan-ui-benchmark.json
          if-no-files-found: warn
          retention-days: 90
