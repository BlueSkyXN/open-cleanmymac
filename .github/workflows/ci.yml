name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            implementation/pyproject.toml
            requirements-dev.txt

      - name: Install build tools
        run: python -m pip install -r requirements-dev.txt

      - name: Lint, tests, and isolated feature preview
        run: make ci-check

      - name: Build wheel and sdist
        run: make package

      - name: Audit release archives
        run: make release-check

      - name: Validate focused runner from sdist
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/openclean-sdist"
          tar -xzf implementation/dist/*.tar.gz -C "$RUNNER_TEMP/openclean-sdist"
          cd "$RUNNER_TEMP/openclean-sdist"/open_cleanmymac-*
          PYTHONPATH=. python -W error scripts/run_focused_tests.py test_focused_runner.py

      - name: Install wheel in an isolated venv
        shell: bash
        run: |
          python -m venv /tmp/openclean-release-venv
          /tmp/openclean-release-venv/bin/python -m pip install --no-deps implementation/dist/*.whl
          /tmp/openclean-release-venv/bin/openclean --version
          /tmp/openclean-release-venv/bin/openclean --help
          /tmp/openclean-release-venv/bin/python -m openclean cat --json
          cd /tmp
          /tmp/openclean-release-venv/bin/python "$GITHUB_WORKSPACE/implementation/scripts/check_installed_wheel.py"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: open-cleanmymac-dist-${{ matrix.os }}
          path: implementation/dist/*
          if-no-files-found: error
          retention-days: 14
