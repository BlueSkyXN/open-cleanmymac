name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: macOS / Python 3.11
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: implementation/pyproject.toml

      - name: Install build tools
        run: >-
          python -m pip install
          build==1.4.0
          ruff==0.16.0
          setuptools==82.0.0
          wheel==0.46.3

      - name: Lint, tests, and isolated feature preview
        run: make check

      - name: Build wheel and sdist
        run: make package

      - name: Audit release archives
        run: make release-check

      - name: Install wheel in an isolated venv
        shell: bash
        run: |
          python -m venv /tmp/openclean-release-venv
          /tmp/openclean-release-venv/bin/python -m pip install --no-deps implementation/dist/*.whl
          /tmp/openclean-release-venv/bin/openclean --version
          /tmp/openclean-release-venv/bin/openclean --help
          /tmp/openclean-release-venv/bin/python -m openclean cat --json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: open-cleanmymac-dist
          path: implementation/dist/*
          if-no-files-found: error
          retention-days: 14
