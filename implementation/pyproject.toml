[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-cleanmymac"
dynamic = ["version"]
description = "Clean-room macOS cleanup CLI implemented in Python"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["macos", "cleanup", "disk-space", "cli", "clean-room"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/BlueSkyXN/open-cleanmymac"
Repository = "https://github.com/BlueSkyXN/open-cleanmymac"
Issues = "https://github.com/BlueSkyXN/open-cleanmymac/issues"
Documentation = "https://github.com/BlueSkyXN/open-cleanmymac/tree/main/docs"
Changelog = "https://github.com/BlueSkyXN/open-cleanmymac/blob/main/CHANGELOG.md"

[project.scripts]
openclean = "openclean.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "openclean.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["openclean*"]
exclude = ["tests*"]
